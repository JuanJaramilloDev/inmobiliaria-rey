<section class="property-search">

  <div class="search-container">

    <div class="search-field location-field">

      <i class="bi bi-geo-alt"></i>

      <div class="field-content">
        <span>Ubicación</span>
        <input
          type="text"
          placeholder="Ej. Pasto, Nariño"
          name="ubicacion"
          [(ngModel)]="ubicacion"
        >
      </div>

    </div>


    <div class="search-divider"></div>


    <div class="search-field">

      <i class="bi bi-building"></i>

      <div class="field-content">

        <span>Tipo de propiedad</span>

        <select name="tipo" [(ngModel)]="tipoPropiedad">
          <option value="">Todos</option>
          <option value="Casa">Casa</option>
          <option value="Apartamento">Apartamento</option>
          <option value="Lote">Lote</option>
          <option value="Local">Local</option>
          <option value="Oficina">Oficina</option>
        </select>

      </div>

    </div>


    <div class="search-divider"></div>


    <div class="search-field">

      <i class="bi bi-tag"></i>

      <div class="field-content">

        <span>Operación</span>

        <select name="operacion" [(ngModel)]="operacion">
          <option value="Venta">Venta</option>
          <option value="Alquiler">Arriendo</option>
          <option value="Anticres">Anticres</option>
        </select>

      </div>

    </div>


    <button type="button" class="search-button" (click)="buscar()">

      <i class="bi bi-search"></i>

      <span>Buscar</span>

    </button>

  </div>

</section>
